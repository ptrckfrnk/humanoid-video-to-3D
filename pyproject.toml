[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "video-to-3d"
version = "0.1.0"
description = "Video to 3D scene reconstruction — Humanoid internship challenge"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["pipeline*", "viz*", "utils*", "scripts*"]

[project.scripts]
video-to-3d = "run:main"
